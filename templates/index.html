<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #222; }
        form.nuevo { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        form.nuevo input { padding: 8px; flex: 1; min-width: 120px; }
        form.nuevo button { padding: 8px 16px; background: #2563eb; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        .total { font-size: 1.2em; font-weight: bold; margin-top: 15px; }
        button.eliminar { background: #dc2626; color: white; border: none; padding: 4px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Gestor de Gastos</h1>

    <form class="nuevo" action="/agregar" method="POST">
        <input type="text" name="descripcion" placeholder="Descripción" required>
        <input type="number" step="0.01" name="monto" placeholder="Monto" required>
        <input type="text" name="categoria" placeholder="Categoría">
        <button type="submit">Agregar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Descripción</th>
                <th>Monto</th>
                <th>Categoría</th>
                <th>Fecha</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for gasto in gastos %}
            <tr>
                <td>{{ gasto.descripcion }}</td>
                <td>${{ "%.2f"|format(gasto.monto) }}</td>
                <td>{{ gasto.categoria or "-" }}</td>
                <td>{{ gasto.fecha.strftime("%d/%m/%Y") }}</td>
                <td>
                    <form action="/eliminar/{{ gasto.id }}" method="POST" style="margin:0;">
                        <button class="eliminar" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p class="total">Total gastado: ${{ "%.2f"|format(total) }}</p>
</body>
</html>
